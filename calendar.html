<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Home Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="/">Home</a>
    <a href="/links.html">Links</a>
    <a href="/commands.html">Commands</a>
    <a href="/projects.html">Projects</a>
    <a href="/calendar.html">Calendar</a>
</nav>

<div class="dashboard-container">

<!-- <h1>Family Dashboard</h1> -->

<div class="dashboard">

    <div class="widget quotes-widget">
        <!-- <h2>Quotes</h2> -->
        <div id="quote-display" class="quote-display">Loading...</div>
    </div>

    <div class="widget time-widget">
        <p id="date" class="date-display">Loading...</p>
        <p id="clock" class="clock-display">Loading...</p>
    </div>

    <div class="widget calendar-widget">

        <h2>This Week</h2>

        <div id="calendar-header" class="calendar-header"></div>

        <div id="calendar-grid" class="week-agenda"></div>

    </div>

    <div class="widget weather-widget">
        <!-- <h2>Weather</h2> -->
        <div id="weather-location" class="weather-location">Locating...</div>
        <div id="weather" class="weather-display">Loading...</div>
    </div>

    <div class="widget projects-widget">
        <h2>Projects In Progress</h2>
        <div id="projects-inprogress" class="projects-inprogress-list">Loading...</div>
    </div>

</div>
</div>

<script src="script.js" defer></script>

</body>
</html>
