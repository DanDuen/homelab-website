<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Projects</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="/">Home</a>
    <a href="/links.html">Links</a>
    <a href="/commands.html">Commands</a>
    <a href="/projects.html">Projects</a>
    <a href="/calendar.html">Calendar</a>
</nav>

<div class="container">

<h1 style="text-align: center;">Homelab Projects</h1>

<p>Drag cards between cells, or use the form to add new ones.</p>

<div class="add-card-form">
    <input type="text" id="new-title" placeholder="New project...">
    <select id="new-column">
        <option value="backlog">Backlog</option>
        <option value="todo">To Do</option>
        <option value="in-progress">In Progress</option>
        <option value="completed">Completed</option>
    </select>
    <select id="new-category">
        <option value="personal">Personal</option>
        <option value="professional">Professional</option>
    </select>
    <button onclick="addCard()">+ Add</button>
</div>

<div class="kanban-grid">

    <div class="kanban-corner"></div>
    <div class="kanban-col-header">Backlog</div>
    <div class="kanban-col-header">To Do</div>
    <div class="kanban-col-header">In Progress</div>
    <div class="kanban-col-header">Completed</div>

    <div class="kanban-row-header">Professional</div>
    <div class="kanban-cell" data-column="backlog" data-category="professional"></div>
    <div class="kanban-cell" data-column="todo" data-category="professional"></div>
    <div class="kanban-cell" data-column="in-progress" data-category="professional"></div>
    <div class="kanban-cell" data-column="completed" data-category="professional"></div>

    <div class="kanban-row-header">Personal</div>
    <div class="kanban-cell" data-column="backlog" data-category="personal"></div>
    <div class="kanban-cell" data-column="todo" data-category="personal"></div>
    <div class="kanban-cell" data-column="in-progress" data-category="personal"></div>
    <div class="kanban-cell" data-column="completed" data-category="personal"></div>

</div>

<h2>Archive</h2>
<p>Old completed projects, moved out of the main board.</p>
<div class="archive-list" id="archive-list"></div>

</div>

<script src="projects.js" defer></script>

</body>

</html>
